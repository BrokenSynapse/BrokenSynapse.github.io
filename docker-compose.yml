services:
  caddy:
    image: caddy:latest
    container_name: bs-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./site:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - horizon-chat

  horizon-chat:
    image: node:24-bookworm-slim
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    environment:
      HORIZON_BIND: 0.0.0.0
      HORIZON_DB: /data/horizon.sqlite
      HORIZON_SECURE_COOKIE: "1"
    volumes:
      - ./horizon-chat:/app:ro
      - horizon_data:/data

  api:
    build: ./api
    container_name: bs-api
    restart: unless-stopped
    environment:
      ASSET_ROOT: /site/lmi/assets
      ASSET_URL_PREFIX: /lmi/assets
      PORT: 3000
      DB_PATH: /data/brokensynapse.sqlite
      SHEET_ID: 1Kis40W84qlJVKvC6One9DX1iQvl0V71GL3UYXuZdWQc
      ADMIN_TOKEN: change-me-after-deploy
    volumes:
      - ./site/lmi/assets:/site/lmi/assets
      - ./data:/data
      - ./site:/site
      - ./uploads:/uploads

volumes:
  caddy_data:
  caddy_config:
  horizon_data:
