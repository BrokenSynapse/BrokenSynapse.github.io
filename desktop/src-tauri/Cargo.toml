[package]
name = "horizon-chat-desktop"
version = "0.6.5"
edition = "2024"

[features]
qa-fixture = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
flate2 = "1"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Networking_Connectivity"] }
